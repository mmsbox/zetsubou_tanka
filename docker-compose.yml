services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  web:
    build: .
    entrypoint: []
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails s -b 0.0.0.0"
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      POSTGRES_PASSWORD: password
      RAILS_ENV: development
      RACK_ENV: development
    depends_on:
      - db

volumes:
  postgres_data:
