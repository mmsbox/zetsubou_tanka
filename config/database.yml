default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: postgres
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password" } %>

development:
  <<: *default
  database: zetsubou_tanka_development

test:
  <<: *default
  database: zetsubou_tanka_test

production:
  <<: *default
  database: zetsubou_tanka_production
