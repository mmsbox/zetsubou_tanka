services:
  - type: web
    name: despair-tanka
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: despair-tanka-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: "3000"

databases:
  - name: despair-tanka-db
    plan: free
    region: singapore
