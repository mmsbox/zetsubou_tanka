services:
  - type: web
    name: despair-tanka
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: despair-tanka-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: "3000"
      # 📮 メール送信（パスワード再設定など）。未設定ならメールは送信されない
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAILER_FROM
        sync: false

databases:
  - name: despair-tanka-db
    plan: free
    region: singapore
